services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: elevenwriter
      POSTGRES_USER: elevenwriter
      POSTGRES_PASSWORD: elevenwriter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./app/server
    environment:
      ELEVENWRITER_DATABASE_URL: postgresql+psycopg://elevenwriter:elevenwriter@db:5432/elevenwriter
      ELEVENWRITER_APP_ENV: docker
      ELEVENWRITER_SCHEDULER_POLL_SECONDS: 5
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./app/server
    environment:
      ELEVENWRITER_DATABASE_URL: postgresql+psycopg://elevenwriter:elevenwriter@db:5432/elevenwriter
      ELEVENWRITER_APP_ENV: docker
      ELEVENWRITER_SCHEDULER_POLL_SECONDS: 5
    depends_on:
      - db
    command: elevenwriter scheduler-worker

  clickhouse:
    image: clickhouse/clickhouse-server:26.6
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_DB: elevenwriter
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse

volumes:
  postgres-data:
  clickhouse-data:
