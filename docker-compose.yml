services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: elevenwriter
      POSTGRES_USER: elevenwriter
      POSTGRES_PASSWORD: elevenwriter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./app/server
    environment:
      ELEVENWRITER_DATABASE_URL: postgresql+psycopg://elevenwriter:elevenwriter@db:5432/elevenwriter
      ELEVENWRITER_APP_ENV: docker
      ELEVENWRITER_AUTH_MODE: token
      ELEVENWRITER_OPERATOR_API_TOKEN: ${ELEVENWRITER_OPERATOR_API_TOKEN:?Set a 32+ character operator token in your shell or .env file.}
      ELEVENWRITER_SCHEDULER_POLL_SECONDS: 5
      ELEVENWRITER_DISCOVERY_ALLOW_PRIVATE_NETWORKS: ${ELEVENWRITER_DISCOVERY_ALLOW_PRIVATE_NETWORKS:-false}
      ELEVENWRITER_CLICKHOUSE_ENABLED: ${ELEVENWRITER_CLICKHOUSE_ENABLED:-false}
      ELEVENWRITER_CLICKHOUSE_URL: ${ELEVENWRITER_CLICKHOUSE_URL:-http://clickhouse:8123}
      ELEVENWRITER_CLICKHOUSE_DATABASE: ${ELEVENWRITER_CLICKHOUSE_DATABASE:-elevenwriter}
      ELEVENWRITER_CLICKHOUSE_USER: ${ELEVENWRITER_CLICKHOUSE_USER:-default}
      ELEVENWRITER_CLICKHOUSE_PASSWORD: ${ELEVENWRITER_CLICKHOUSE_PASSWORD:-}
      ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT: ${ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT:-}
      ELEVENWRITER_CLICKHOUSE_R2_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID: ${ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID:-}
      ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY: ${ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY:-}
      ELEVENWRITER_CLICKHOUSE_R2_REGION: ${ELEVENWRITER_CLICKHOUSE_R2_REGION:-auto}
      ELEVENWRITER_CLICKHOUSE_R2_ARCHIVE_PREFIX: ${ELEVENWRITER_CLICKHOUSE_R2_ARCHIVE_PREFIX:-11writer-archive}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_MODE: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_MODE:-archive_only}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX:-11writer-clickhouse}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY:-r2_main}
      ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE: ${ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE:-10Gi}
    depends_on:
      - db
    ports:
      # Token-authenticated API. Keep it local unless an authenticated reverse proxy is
      # deliberately configured and ELEVENWRITER_OPERATOR_API_TOKEN is protected.
      - "${ELEVENWRITER_API_BIND:-127.0.0.1}:8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./app/server
    environment:
      ELEVENWRITER_DATABASE_URL: postgresql+psycopg://elevenwriter:elevenwriter@db:5432/elevenwriter
      ELEVENWRITER_APP_ENV: docker
      ELEVENWRITER_AUTH_MODE: token
      ELEVENWRITER_OPERATOR_API_TOKEN: ${ELEVENWRITER_OPERATOR_API_TOKEN:?Set a 32+ character operator token in your shell or .env file.}
      ELEVENWRITER_SCHEDULER_POLL_SECONDS: 5
      ELEVENWRITER_DISCOVERY_ALLOW_PRIVATE_NETWORKS: ${ELEVENWRITER_DISCOVERY_ALLOW_PRIVATE_NETWORKS:-false}
      ELEVENWRITER_CLICKHOUSE_ENABLED: ${ELEVENWRITER_CLICKHOUSE_ENABLED:-false}
      ELEVENWRITER_CLICKHOUSE_URL: ${ELEVENWRITER_CLICKHOUSE_URL:-http://clickhouse:8123}
      ELEVENWRITER_CLICKHOUSE_DATABASE: ${ELEVENWRITER_CLICKHOUSE_DATABASE:-elevenwriter}
      ELEVENWRITER_CLICKHOUSE_USER: ${ELEVENWRITER_CLICKHOUSE_USER:-default}
      ELEVENWRITER_CLICKHOUSE_PASSWORD: ${ELEVENWRITER_CLICKHOUSE_PASSWORD:-}
      ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT: ${ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT:-}
      ELEVENWRITER_CLICKHOUSE_R2_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID: ${ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID:-}
      ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY: ${ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY:-}
      ELEVENWRITER_CLICKHOUSE_R2_REGION: ${ELEVENWRITER_CLICKHOUSE_R2_REGION:-auto}
      ELEVENWRITER_CLICKHOUSE_R2_ARCHIVE_PREFIX: ${ELEVENWRITER_CLICKHOUSE_R2_ARCHIVE_PREFIX:-11writer-archive}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_MODE: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_MODE:-archive_only}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX:-11writer-clickhouse}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY:-r2_main}
      ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE: ${ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE:-10Gi}
    depends_on:
      - db
    command: elevenwriter scheduler-worker

  # This is deliberately a one-shot, stdin/stdout worker rather than a network
  # service. Run it with `docker compose --profile local-intelligence run -T
  # local-intelligence-worker`; it has no network namespace to expose.
  local-intelligence-worker:
    profiles: ["local-intelligence"]
    build:
      context: ./app/server
      dockerfile: local_intelligence_worker/Dockerfile
    image: elevenwriter-local-intelligence-worker:local
    network_mode: "none"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ELEVENWRITER_LOCAL_INTELLIGENCE_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      NO_PROXY: "*"
      PYTHONDONTWRITEBYTECODE: "1"
      # Image-pinned ONNX runner; the operator supplies its verified source hash.
      ELEVENWRITER_LOCAL_INTELLIGENCE_MODEL_RUNNER: ${ELEVENWRITER_LOCAL_INTELLIGENCE_MODEL_RUNNER:-/opt/runner/onnx_image_runner.py}
      ELEVENWRITER_LOCAL_INTELLIGENCE_MODEL_RUNNER_SHA256: ${ELEVENWRITER_LOCAL_INTELLIGENCE_MODEL_RUNNER_SHA256:-}
      ELEVENWRITER_APPROVED_MODEL_PATH: ${ELEVENWRITER_APPROVED_MODEL_PATH:-}
      ELEVENWRITER_APPROVED_MODEL_SHA256: ${ELEVENWRITER_APPROVED_MODEL_SHA256:-}
      ELEVENWRITER_LOCAL_INTELLIGENCE_TIMEOUT_SECONDS: ${ELEVENWRITER_LOCAL_INTELLIGENCE_TIMEOUT_SECONDS:-60}
    volumes:
      # Artifact ledger/input bytes and models are both immutable to this worker.
      - type: bind
        source: ${ELEVENWRITER_LOCAL_INTELLIGENCE_DATA_DIR:-./var}
        target: /data
        read_only: true
      - type: bind
        source: ${ELEVENWRITER_LOCAL_INTELLIGENCE_MODELS_DIR:-./var/models}
        target: /models
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /output:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=65532,gid=65532
    stdin_open: true
    tty: false
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:26.6
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_DB: ${ELEVENWRITER_CLICKHOUSE_DATABASE:-elevenwriter}
      CLICKHOUSE_USER: ${ELEVENWRITER_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${ELEVENWRITER_CLICKHOUSE_PASSWORD:-}
      ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT: ${ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT:-}
      ELEVENWRITER_CLICKHOUSE_R2_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID: ${ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID:-}
      ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY: ${ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY:-}
      ELEVENWRITER_CLICKHOUSE_R2_REGION: ${ELEVENWRITER_CLICKHOUSE_R2_REGION:-auto}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX:-11writer-clickhouse}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY:-r2_main}
      ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE: ${ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE:-10Gi}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./app/server/11writer-r2-storage.xml:/etc/clickhouse-server/config.d/11writer-r2-storage.xml:ro

volumes:
  postgres-data:
  clickhouse-data:
