services:
  db:
    image: postgis/postgis:16-3.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      POSTGRES_DB: elevenwriter
      POSTGRES_USER: elevenwriter
      POSTGRES_PASSWORD: elevenwriter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./app/server
    environment:
      ELEVENWRITER_DATABASE_URL: postgresql+psycopg://elevenwriter:elevenwriter@db:5432/elevenwriter
      ELEVENWRITER_DATABASE_AUTO_MIGRATE: "false"
      ELEVENWRITER_APP_ENV: docker
      ELEVENWRITER_SCHEDULER_POLL_SECONDS: 5
      ELEVENWRITER_CLICKHOUSE_ENABLED: ${ELEVENWRITER_CLICKHOUSE_ENABLED:-false}
      ELEVENWRITER_CLICKHOUSE_URL: ${ELEVENWRITER_CLICKHOUSE_URL:-http://clickhouse:8123}
      ELEVENWRITER_CLICKHOUSE_DATABASE: ${ELEVENWRITER_CLICKHOUSE_DATABASE:-elevenwriter}
      ELEVENWRITER_CLICKHOUSE_USER: ${ELEVENWRITER_CLICKHOUSE_USER:-default}
      ELEVENWRITER_CLICKHOUSE_PASSWORD: ${ELEVENWRITER_CLICKHOUSE_PASSWORD:-}
      ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT: ${ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT:-}
      ELEVENWRITER_CLICKHOUSE_R2_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID: ${ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID:-}
      ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY: ${ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY:-}
      ELEVENWRITER_CLICKHOUSE_R2_REGION: ${ELEVENWRITER_CLICKHOUSE_R2_REGION:-auto}
      ELEVENWRITER_CLICKHOUSE_R2_ARCHIVE_PREFIX: ${ELEVENWRITER_CLICKHOUSE_R2_ARCHIVE_PREFIX:-11writer-archive}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_MODE: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_MODE:-archive_only}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX:-11writer-clickhouse}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY:-r2_main}
      ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE: ${ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE:-10Gi}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "elevenwriter migrate-db &&
      uvicorn src.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./app/server
    environment:
      ELEVENWRITER_DATABASE_URL: postgresql+psycopg://elevenwriter:elevenwriter@db:5432/elevenwriter
      ELEVENWRITER_DATABASE_AUTO_MIGRATE: "false"
      ELEVENWRITER_APP_ENV: docker
      ELEVENWRITER_SCHEDULER_POLL_SECONDS: 5
      ELEVENWRITER_CLICKHOUSE_ENABLED: ${ELEVENWRITER_CLICKHOUSE_ENABLED:-false}
      ELEVENWRITER_CLICKHOUSE_URL: ${ELEVENWRITER_CLICKHOUSE_URL:-http://clickhouse:8123}
      ELEVENWRITER_CLICKHOUSE_DATABASE: ${ELEVENWRITER_CLICKHOUSE_DATABASE:-elevenwriter}
      ELEVENWRITER_CLICKHOUSE_USER: ${ELEVENWRITER_CLICKHOUSE_USER:-default}
      ELEVENWRITER_CLICKHOUSE_PASSWORD: ${ELEVENWRITER_CLICKHOUSE_PASSWORD:-}
      ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT: ${ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT:-}
      ELEVENWRITER_CLICKHOUSE_R2_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID: ${ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID:-}
      ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY: ${ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY:-}
      ELEVENWRITER_CLICKHOUSE_R2_REGION: ${ELEVENWRITER_CLICKHOUSE_R2_REGION:-auto}
      ELEVENWRITER_CLICKHOUSE_R2_ARCHIVE_PREFIX: ${ELEVENWRITER_CLICKHOUSE_R2_ARCHIVE_PREFIX:-11writer-archive}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_MODE: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_MODE:-archive_only}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX:-11writer-clickhouse}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY:-r2_main}
      ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE: ${ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE:-10Gi}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "elevenwriter migrate-db &&
      elevenwriter scheduler-worker"

  clickhouse:
    image: clickhouse/clickhouse-server:26.6
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_DB: ${ELEVENWRITER_CLICKHOUSE_DATABASE:-elevenwriter}
      CLICKHOUSE_USER: ${ELEVENWRITER_CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${ELEVENWRITER_CLICKHOUSE_PASSWORD:-}
      ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT: ${ELEVENWRITER_CLICKHOUSE_R2_ENDPOINT:-}
      ELEVENWRITER_CLICKHOUSE_R2_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID: ${ELEVENWRITER_CLICKHOUSE_R2_ACCESS_KEY_ID:-}
      ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY: ${ELEVENWRITER_CLICKHOUSE_R2_SECRET_ACCESS_KEY:-}
      ELEVENWRITER_CLICKHOUSE_R2_REGION: ${ELEVENWRITER_CLICKHOUSE_R2_REGION:-auto}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_BUCKET:-}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_PREFIX:-11writer-clickhouse}
      ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY: ${ELEVENWRITER_CLICKHOUSE_R2_STORAGE_POLICY:-r2_main}
      ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE: ${ELEVENWRITER_CLICKHOUSE_R2_CACHE_SIZE:-10Gi}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./app/server/11writer-r2-storage.xml:/etc/clickhouse-server/config.d/11writer-r2-storage.xml:ro

volumes:
  postgres-data:
  clickhouse-data:
