services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: 11writer-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: 11writer
      POSTGRES_USER: 11writer
      POSTGRES_PASSWORD: 11writer
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 11writer -d 11writer"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgis-data:
